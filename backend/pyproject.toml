[project]
name = "aria2-backend"
version = "0.1.0"
description = "ARIA — Air Liquide Intelligent Assistant backend"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
addopts = "-q"
